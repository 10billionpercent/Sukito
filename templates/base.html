<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Testing{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/x-icon">
</head>
<body>
    {% block content %}
    {% include "components/header.html" %}

    {% from "components/pill.html" import Pill %}
    {{ Pill("MEOWWWW", variant="genre") }}
    {{ Pill("MEOWWWW", variant="status") }}
    {{ Pill("MEOWWWW", variant="type") }}
    {% endblock %}

    <script src="{{ url_for('static', filename='js/cursorGlow.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/tooltip.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/pill.js') }}" defer></script>

</body>
</html>
