{# Jinja component-style macro (React-ish "props"). #}
{% macro Pill(text, variant="genre", selected=false, icon_unselected="plus", icon_selected="x") -%}
<button
  type="button"
  class="pill {{ variant }}-pill{% if selected %} selected{% endif %}"
  data-icon-unselected="{{ icon_unselected }}"
  data-icon-selected="{{ icon_selected }}"
>
  <i class="bi bi-{% if selected %}{{ icon_selected }}{% else %}{{ icon_unselected }}{% endif %}"></i>
  {{ text }}
</button>
{%- endmacro %}

{% macro PillBehavior() -%}
<script>
  if (!window.__pillBound) {
    window.__pillBound = true;

    document.addEventListener("click", (e) => {
      const pill = e.target.closest(".pill");
      if (!pill) return;

      e.preventDefault();
      pill.classList.toggle("selected");

      const icon = pill.querySelector("i.bi");
      if (!icon) return;

      const isSelected = pill.classList.contains("selected");

      icon.classList.toggle(`bi-plus`, !isSelected);
      icon.classList.toggle(`bi-x`, isSelected);
    });
  }
</script>
{%- endmacro %}
