{% macro Pill(text, variant="genre", selected=false, icon_unselected="plus", icon_selected="x") -%}
<button
  type="button"
  class="pill {{ variant }}-pill{% if selected %} selected{% endif %}"
  data-icon-unselected="{{ icon_unselected }}"
  data-icon-selected="{{ icon_selected }}"
>
  <i class="bi bi-{% if selected %}{{ icon_selected }}{% else %}{{ icon_unselected }}{% endif %}"></i>
  {{ text }}
</button>
{%- endmacro %}
